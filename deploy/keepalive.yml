# Render's free plan sleeps after 15 minutes without traffic, and a cold start takes ~1 minute, long
# enough for the dApp to fall back to mock data. Pinging the health endpoint keeps it awake during judging.
# Install: move this file to .github/workflows/ (see docs/deploy.md §4). Set the repository variable BACKEND_URL (Settings → Secrets and variables → Actions → Variables).
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - name: Ping /api/health
        run: curl --fail --silent --show-error --max-time 90 "${{ vars.BACKEND_URL }}/api/health"
